
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Google Maps POIs & Landmark Icon Explorer by @abumuailek</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; display: flex; }
    .left { width: 30%; padding: 20px; background: #f7f7f7; box-shadow: 2px 0 5px rgba(0,0,0,0.1); }
    .right { flex: 1; padding: 20px; overflow-y: scroll; max-height: 100vh; }
    input, button { width: 100%; padding: 10px; margin: 5px 0; }
    canvas { margin-top: 20px; border: 1px solid #ccc; }
    .accordion-section { margin-bottom: 10px; }
    .accordion-header { cursor: pointer; background: #ddd; padding: 8px; font-weight: bold; }
    .accordion-content { display: none; padding: 5px 10px; background: #eee; }
    .landmark-link { display: block; margin: 3px 0; color: #007BFF; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="left">
    <h3>Manual Input</h3>
    <input type="text" id="landmark" placeholder="e.g. cairo_tower" />
    <button onclick="mergeLayers()">Generate Icon</button>
    <canvas id="resultCanvas" width="64" height="64"></canvas>
    <a id="downloadLink" style="display:none;" download>Download PNG</a>
  </div>
  <div class="right" id="accordionContainer">
    <h2>Landmark Explorer</h2>
  </div>

  <script>
    const tree = __LANDMARK_DATA__;

    function createAccordion(container, data) {
      for (const continent in data) {
        const continentDiv = document.createElement("div");
        continentDiv.classList.add("accordion-section");

        const header = document.createElement("div");
        header.classList.add("accordion-header");
        header.textContent = continent;
        header.onclick = () => {
          content.style.display = content.style.display === "block" ? "none" : "block";
        };

        const content = document.createElement("div");
        content.classList.add("accordion-content");

        for (const country in data[continent]) {
          const countryDiv = document.createElement("div");
          countryDiv.innerHTML = `<strong>${country}</strong>`;
          for (const city in data[continent][country]) {
            const cityDiv = document.createElement("div");
            cityDiv.innerHTML = `<em>${city}</em>`;
            data[continent][country][city].forEach(poi => {
              const link = document.createElement("a");
              link.className = "landmark-link";
              link.textContent = poi;
              link.onclick = () => {
                const id = poi.toLowerCase().replace(/[^a-z0-9]+/g, "_");
                document.getElementById("landmark").value = id;
                mergeLayers();
              };
              cityDiv.appendChild(link);
            });
            countryDiv.appendChild(cityDiv);
          }
          content.appendChild(countryDiv);
        }

        continentDiv.appendChild(header);
        continentDiv.appendChild(content);
        container.appendChild(continentDiv);
      }
    }

    async function loadImage(url) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.onerror = reject;
        img.src = url;
      });
    }

    async function mergeLayers() {
      const rawName = document.getElementById("landmark").value.trim();
      const canvas = document.getElementById("resultCanvas");
      const ctx = canvas.getContext("2d");
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      try {
        const base = `https://www.google.com/maps/vt/icon/name=assets/icons/poi/iconic/${rawName}_layer_`;
        const imgs = await Promise.all([1, 2, 3, 4].map(i => loadImage(`${base}${i}-2-medium.png&scale=4`)));
        canvas.width = imgs[0].width;
        canvas.height = imgs[0].height;
        imgs.forEach(img => ctx.drawImage(img, 0, 0));

        const download = document.getElementById("downloadLink");
        download.href = canvas.toDataURL();
        download.download = rawName.replace(/_/g, " ") + ".png";
        download.textContent = `Download "${download.download}"`;
        download.style.display = 'inline';
      } catch (e) {
        alert("Error loading images. Try a different landmark.");
      }
    }

    document.addEventListener("DOMContentLoaded", () => {
      const container = document.getElementById("accordionContainer");
      createAccordion(container, tree);
    });
  </script>
